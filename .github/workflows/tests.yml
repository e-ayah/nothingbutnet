name: tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ML tests (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: |
          python -m pip install -r ml/requirements.txt pandas
          # MediaPipe installs GUI OpenCV transitively. Match the headless server runtime.
          python -m pip uninstall -y opencv-python opencv-contrib-python
          python -m pip install --no-deps --force-reinstall opencv-contrib-python-headless==4.10.0.84
      - name: Check bundled test clips
        run: |
          test -s ml/tests/data/tiny.mp4
          test -s ml/tests/data/pose_clip.mp4
      - name: Run full ML suite
        run: python -m pytest ml/tests -q --junitxml=test-results/ml.xml
      - name: Save ML test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: test-results/ml.xml
          if-no-files-found: warn

  backend:
    name: API tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nothingbutnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nothingbutnet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nothingbutnet_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nothingbutnet_test
      SECRET_KEY: ci-only-not-a-real-secret
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip uninstall -y opencv-python opencv-contrib-python
          python -m pip install --no-deps --force-reinstall opencv-contrib-python-headless==4.10.0.84
      - name: Run full API suite
        run: python -m pytest backend/tests -q --junitxml=test-results/backend.xml
      - name: Save API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend.xml
          if-no-files-found: warn
