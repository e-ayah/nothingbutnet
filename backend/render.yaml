services:
  - type: web
    name: nothingbutnet-api
    runtime: python
    plan: free
    branch: develop

    buildCommand: >-
      pip install -r backend/requirements.txt &&
      pip uninstall -y opencv-contrib-python opencv-python &&
      pip install --no-deps --force-reinstall opencv-contrib-python-headless==4.10.0.84

    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
